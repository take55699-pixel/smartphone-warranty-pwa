<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Care比較</title>
<meta name="theme-color" content="#0b1020">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="application-name" content="Care比較">
<meta name="apple-mobile-web-app-title" content="Care比較">
<link rel="manifest" href="./manifest-v8.webmanifest?v=10">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/care-install-v10-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="./icons/care-install-v10-512.png">
<link rel="apple-touch-icon" sizes="180x180" href="./icons/care-install-v10-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#08101e;font-family:"Noto Sans JP",sans-serif;overflow:hidden}iframe{display:block;width:100%;height:100%;border:0}.install{position:fixed;right:14px;bottom:max(14px,calc(env(safe-area-inset-bottom) + 10px));z-index:50;border:1px solid #5a82bf;border-radius:999px;background:#183f70;color:#fff;min-height:48px;padding:0 18px;font:800 14px "Noto Sans JP",sans-serif;box-shadow:0 10px 28px rgba(0,0,0,.4);display:none}
</style>
</head>
<body>
<iframe src="./index.html?install=v10" title="AppleCare+ × Pixel Care+ 比較"></iframe>
<button id="installBtn" class="install" type="button">アプリをインストール</button>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(()=>{}));}
let deferredPrompt=null;const btn=document.getElementById('installBtn');
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;btn.style.display='block';});
btn.addEventListener('click',async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;btn.style.display='none';});
window.addEventListener('appinstalled',()=>{btn.style.display='none';});
</script>
</body>
</html>
